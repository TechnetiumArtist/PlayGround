<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VESPER-9 // Planetfall</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eff6e9;background:#0b1010}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#0b1010}canvas{display:block;position:absolute;inset:0;width:100%;height:100%}.grain{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E")}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 47%,transparent 35%,rgba(4,8,7,.24) 72%,rgba(3,6,5,.72) 100%)}.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;left:28px;right:28px;top:22px;display:flex;justify-content:space-between;align-items:flex-start;text-transform:uppercase}.brand{font-size:11px;letter-spacing:.28em;color:#c4d1c3}.brand b{color:#d7ef78}.status{display:flex;gap:14px;font-size:9px;letter-spacing:.16em;color:#9aa9a0}.status i{display:inline-block;width:5px;height:5px;margin-right:7px;border-radius:50%;background:#cddd79;box-shadow:0 0 9px #cddd79}.compass{position:absolute;top:28px;left:50%;width:300px;transform:translateX(-50%);text-align:center;color:#b3c0b5;font-size:9px;letter-spacing:.32em}.compass:before{content:"";position:absolute;left:0;right:0;top:16px;height:1px;background:linear-gradient(90deg,transparent,#81928755,transparent)}.compass .p{display:inline-block;padding:0 10px;background:#151e1b80}.objective{position:absolute;right:28px;top:94px;width:230px;padding:14px 16px;border-left:1px solid #cbdc84;background:linear-gradient(90deg,#17231eaa,transparent)}.objective small{display:block;font-size:8px;letter-spacing:.22em;color:#9eae9f;margin-bottom:6px}.objective strong{font-size:12px;font-weight:550}.reticle{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:1px solid rgba(218,236,199,.7);border-radius:50%}.reticle:before,.reticle:after{content:"";position:absolute;background:#dbea96}.reticle:before{width:5px;height:1px;left:6px;top:8px}.reticle:after{width:1px;height:5px;left:8px;top:6px}.bottom{position:absolute;left:28px;right:28px;bottom:22px;display:flex;align-items:flex-end;justify-content:space-between}.telemetry{width:210px}.telemetry label{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.16em;color:#91a198;margin-bottom:6px}.bar{height:3px;background:#52615955}.bar i{display:block;width:34%;height:100%;background:#c8d96e}.location{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);text-align:center;font-size:8px;letter-spacing:.18em;color:#9aa89f}.location b{display:block;margin-top:5px;font-size:11px;color:#dceacb}.controls{pointer-events:auto;display:flex;gap:8px}.control{width:42px;height:42px;border:1px solid #6d7f7390;border-radius:50%;color:#dce8d1;background:#15201988;font:11px Inter,sans-serif;cursor:pointer}.control:hover{background:#3c4a39}.move{position:absolute;left:28px;bottom:86px;display:none;grid-template-columns:repeat(3,42px);gap:5px;pointer-events:auto}.move button{width:42px;height:42px;border:1px solid #75877a;border-radius:50%;background:#152019cc;color:#edf5df}.move button:nth-child(1){grid-column:2}.move button:nth-child(2){grid-column:1}.notification{position:absolute;left:50%;top:62%;transform:translate(-50%,15px);opacity:0;padding:8px 12px;background:#111a16c9;border:1px solid #7c906e;font-size:9px;letter-spacing:.12em;text-transform:uppercase;transition:.25s}.notification.show{opacity:1;transform:translate(-50%,0)}.interact{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);pointer-events:auto;border:1px solid #d2de99;background:#19241cdd;color:#edf4df;padding:9px 13px;font-size:9px;letter-spacing:.12em;opacity:0;transition:.2s}.interact.show{opacity:1}.crossfade{position:absolute;inset:0;background:#dfe8b6;pointer-events:none;opacity:0;transition:opacity 1.2s}.crossfade.show{opacity:.08}@media(max-width:700px){.topbar{left:16px;right:16px;top:14px}.status span:first-child{display:none}.objective{right:12px;top:65px;width:190px}.compass{display:none}.bottom{left:16px;right:16px;bottom:12px}.location{bottom:12px}.telemetry{width:150px}.move{display:grid;left:12px;bottom:82px}.controls{display:none}.interact{bottom:68px}}
</style>
</head>
<body>
<canvas id="world"></canvas><div class="grain"></div><div class="vignette"></div>
<div class="hud">
 <header class="topbar"><div class="brand">✦ <b>VESPER</b> // PLANETFALL</div><div class="status"><span><i></i>SUIT LINKED</span><span id="clock">04:28 UTC</span></div></header>
 <div class="compass"><span class="p" id="heading">N 000°</span></div>
 <aside class="objective"><small>PRIMARY OBJECTIVE</small><strong id="objective">Reach the crystal formation</strong></aside>
 <div class="reticle"></div>
 <div class="bottom"><div class="telemetry"><label><span>OXYGEN</span><span id="oxygen">98%</span></label><div class="bar"><i id="oxybar"></i></div></div><div class="location"><span id="zone">NORTHERN HIGHLANDS</span><b id="coords">A2 · 28.4</b></div><div class="controls"><button class="control" id="scanbtn" aria-label="Scan">◎</button><button class="control" id="soundbtn" aria-label="Sound">♪</button></div></div>
 <div class="move"><button data-move="forward">▲</button><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div>
 <button class="interact" id="interact">E &nbsp; COLLECT CRYSTAL</button>
 <div class="notification" id="notification"></div>
</div>
<div class="crossfade" id="flash"></div>
<script>
(()=>{
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d');
let w,h,dpr,keys={},yaw=-.12,pitch=.02,playerX=0,playerZ=0,bob=0,oxygen=98,scanned=false,crystalCollected=false,sound=false,last=0;
const crystals=[{x:-.55,z:1.8,got:false},{x:1.25,z:-1.15,got:false},{x:-1.7,z:-2.1,got:false}];
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function notify(t){const n=document.querySelector('#notification');n.textContent=t;n.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),2200)}
function terrainHeight(x,z){return Math.sin(x*2.1+z*.7)*.09+Math.cos(z*2.4-x*.5)*.07+Math.sin((x+z)*5)*.018}
function project(x,y,z){const c=Math.cos(yaw),s=Math.sin(yaw),rx=c*x-s*z,rz=s*x+c*z;if(rz<.15)return null;const sy=y-pitch*(h*.3);const f=h*.82;return[(w*.5)+(rx/rz)*f,(h*.53)-(sy/rz)*f,w/rz]}
function polygon(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawStars(){ctx.fillStyle='#b7c7bd';for(let i=0;i<75;i++){let x=(i*197.3)%w,y=(i*i*31.7)% (h*.44);ctx.globalAlpha=.18+(i%5)*.07;ctx.fillRect(x,y,i%7===0?1.5:.7,i%7===0?1.5:.7)}ctx.globalAlpha=1}
function drawSun(){let x=w*.78,y=h*.14,r=Math.min(w,h)*.018;ctx.fillStyle='#f6efbe';ctx.shadowColor='#d8ca96';ctx.shadowBlur=30;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.shadowBlur=0}
function drawTerrain(){const horizon=h*.43+bob;
 let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#6e8580');g.addColorStop(.38,'#9ba58e');g.addColorStop(.39,'#687d62');g.addColorStop(1,'#1b2b25');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 drawStars();drawSun();
 // distant low-poly mountain rings
 for(let j=0;j<5;j++){let base=horizon+(j*12);ctx.beginPath();ctx.moveTo(-30,horizon+70);for(let i=-1;i<26;i++){let px=i*w/25,py=horizon-18-Math.sin(i*.7+j*1.3)*18-Math.sin(i*1.9+j)*8;ctx.lineTo(px,py)}ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fillStyle=['#52685e','#5f7462','#71806a','#536a5c','#35483f'][j];ctx.fill();}
 // local ground as a low-poly perspective mesh
 const cols=18,rows=16;for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const z1=.35+r*.38,z2=.35+(r+1)*.38;const x1=-7+(c/cols)*14,x2=-7+(c+1)/cols*14;
  const q=[project(x1-playerX,terrainHeight(x1, z1-playerZ)-.12,z1-playerZ),project(x2-playerX,terrainHeight(x2,z1-playerZ)-.12,z1-playerZ),project(x2-playerX,terrainHeight(x2,z2-playerZ)-.12,z2-playerZ),project(x1-playerX,terrainHeight(x1,z2-playerZ)-.12,z2-playerZ)];
  if(q.some(p=>!p))continue;const depth=1-(r/rows);let shade=Math.round(48+depth*38+(c%3)*7);let green=Math.round(65+depth*40+(r%2)*8);ctx.fillStyle=`rgb(${shade*.95},${green},${shade*.75})`;polygon(q.map(p=>[p[0],p[1]]),ctx.fillStyle,'rgba(28,45,38,.16)')}}
}
function drawCrystal(cr){if(cr.got)return;let p=project(cr.x-playerX,.12,cr.z-playerZ);if(!p)return;let s=Math.max(4,120/p[2]);ctx.save();ctx.translate(p[0],p[1]-s*.7);ctx.shadowColor='#9fd8d1';ctx.shadowBlur=18;ctx.fillStyle='#78aaa0';ctx.strokeStyle='#c1ddd0';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.38,-s*.28);ctx.lineTo(s*.22,s*.55);ctx.lineTo(-s*.22,s*.55);ctx.lineTo(-s*.38,-s*.28);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#b9d6c1';ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(0,s*.55);ctx.lineTo(s*.22,s*.55);ctx.lineTo(s*.38,-s*.28);ctx.closePath();ctx.fill();ctx.restore();}
function update(dt){bob=Math.sin(performance.now*.002)*1.2;const speed=dt*.0010;let forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),strafe=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 playerX+=( -Math.sin(yaw)*forward+Math.cos(yaw)*strafe)*speed;playerZ+=(-Math.cos(yaw)*forward-Math.sin(yaw)*strafe)*speed;
 oxygen=Math.max(0,oxygen-dt*.00014);document.querySelector('#oxybar').style.width=oxygen+'%';document.querySelector('#oxygen').textContent=Math.ceil(oxygen)+'%';
 let nearest=Infinity;for(const cr of crystals){if(cr.got)continue;let d=Math.hypot(cr.x-playerX,cr.z-playerZ);nearest=Math.min(nearest,d)}document.querySelector('#interact').classList.toggle('show',nearest<.48&&!crystalCollected);if(nearest<.48&&!crystalCollected)document.querySelector('#interact').textContent='E  ·  COLLECT CRYSTAL';
 let deg=((yaw*180/Math.PI)+360)%360;let dirs=['N','NE','E','SE','S','SW','W','NW'];let d=(Math.round(deg/45)%8);document.querySelector('#heading').textContent=dirs[d]+' '+String(Math.round(deg)).padStart(3,'0')+'°';document.querySelector('#coords').textContent=String.fromCharCode(65+Math.max(0,Math.floor((playerX+2)*2)%5))+Math.ceil(1+Math.abs(playerZ)*4)+' · '+(28+Math.abs(playerX)*3).toFixed(1)}
function collect(){for(const cr of crystals){if(!cr.got&&Math.hypot(cr.x-playerX,cr.z-playerZ)<.48){cr.got=true;notify('Sample recorded · Crystal fragment');oxygen=Math.min(100,oxygen+4);if(crystals.every(c=>c.got)){crystalCollected=true;document.querySelector('#objective').textContent='Survey complete — all samples logged'}else{document.querySelector('#objective').textContent='Locate the remaining crystal samples';}return}}}
function loop(t){let dt=Math.min(40,t-last);last=t;update(dt);drawTerrain();crystals.forEach(drawCrystal);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'||e.code==='Enter')collect();if(e.code==='KeyF'){scanned=!scanned;document.querySelector('#flash').classList.toggle('show',scanned);notify(scanned?'Terrain scan active':'Scan complete')}});addEventListener('keyup',e=>keys[e.code]=false);
let drag=null;addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY}});addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw-=dx*.004;pitch=Math.max(-.28,Math.min(.28,pitch-dy*.001));drag={x:e.clientX,y:e.clientY}});addEventListener('pointerup',()=>drag=null);
document.querySelector('#interact').onclick=collect;document.querySelector('#scanbtn').onclick=()=>{scanned=!scanned;document.querySelector('#flash').classList.toggle('show',scanned);notify(scanned?'Terrain scan active':'Scan complete')};document.querySelector('#soundbtn').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'◉':'♪';notify(sound?'Ambient audio on':'Ambient audio muted')};
document.querySelectorAll('[data-move]').forEach(b=>{let code={forward:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD'}[b.dataset.move];let on=ev=>{ev.preventDefault();keys[code]=true};let off=ev=>{ev.prevent;keys[code]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off)});
setInterval(()=>{let d=new Date();document.querySelector('#clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})+' UTC'},1000);
})();
</script>
</body>
</html>
